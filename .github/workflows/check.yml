name: Check notes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify sources, imported bodies, links, and assets
        run: python3 scripts/import_scrapbox_math.py --check
      - name: Verify the physics archive
        run: python3 scripts/import_scrapbox_physics.py --check
      - name: Verify the chemistry archive
        run: python3 scripts/import_scrapbox_chemistry.py --check
      - name: Verify oscillator convergence and energy balance
        run: python3 examples/oscillator_energy.py
      - name: Verify the change-of-basis example
        run: python3 examples/change_of_basis.py
